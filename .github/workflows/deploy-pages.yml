name: Deploy Pages (churn-proof)

# Event-driven + scheduled. concurrency (cancel-in-progress:false) COALESCES:
# at most one deploy runs while one stays pending; rapid demo-generator commits
# collapse into the latest pending run instead of cancelling the in-flight one.
# => near-instant (~1 deploy cycle) AND no cancellation churn. Repo is public,
# so Actions minutes are free.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site (exclude VCS + workflows)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ ./_site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
